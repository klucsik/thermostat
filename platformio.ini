[env:nodemcuv2]
platform = espressif8266 @ 4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps = 
	tobiasschuerg/ESP8266 Influxdb@^3.13.2
	tzapu/WiFiManager@^2.0.17
	paulstoffregen/Time@^1.6.1
	paulstoffregen/OneWire@^2.3.8
